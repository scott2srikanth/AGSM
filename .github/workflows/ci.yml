name: CPU validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4'
      - run: python -m pip install '.[dev]'
      - run: python -m scripts.validate_config
      - run: python -m scripts.smoke_test
      - run: python -m experiments.run_experiment --config configs/training/smoke.yaml --output runs/ci
      - run: python -m build
      - run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c 'from agsm import AGSM; from training.trainer import train'
