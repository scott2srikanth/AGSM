[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agsm-research"
version = "0.1.0"
description = "Adaptive Gated State Memory research implementation"
requires-python = ">=3.9"
dependencies = ["torch>=2.4", "PyYAML>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]
tracking = ["wandb>=0.17"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
include = ["agsm*", "baselines*", "data*", "training*", "evaluation*", "benchmarks*", "experiments*", "tracking*", "scripts*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
