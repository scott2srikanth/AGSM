extends: ../model/agsm_tiny.yaml
training:
  seed: 42
  epochs: 12
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  optimizer: adamw
  mixed_precision: false
  patience: 4
  device: auto
loss:
  compute_weight: 0.01
  write_weight: 0.001
  stability_weight: 0.001
  fast_threshold: 8.0
  slow_threshold: 8.0
data:
  name: delayed_recall
  sequence_length: 32
  train_examples: 1024
  validation_examples: 256
  test_examples: 256
evaluation:
  batch_size: 4
  sequence_lengths: [128, 512, 2048, 4096, 8192]
  inference_threshold: 0.99
tracking:
  backend: json
  project: agsm-research
checkpoint:
  save_every_epochs: 1
  resume: true
